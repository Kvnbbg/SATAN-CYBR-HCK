[package]
name = "biochimera"
version = "0.1.0"
edition = "2021"
description = "403-bypass tester for authorized security testing and CTFs"

[[bin]]
name = "biochimera"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.11", default-features = false, features = ["blocking", "rustls-tls"] }
clap = { version = "4", features = ["derive"] }
